version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.3.1
    ports: 
      - '9200:9200'
      - '9300:9300'
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false

  logstash:
    image: docker.elastic.co/logstash/logstash:8.3.1
    ports: 
      - '5044:5044'
    volumes:
      - ./externals/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.3.1
    volumes:
      - ./externals/filebeat/config/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - nglog:/var/log/nginx
    depends_on:
      - logstash
      - nginx

  nginx:
    build:
      context: ./externals/nginx
      #image: nginx
    ports: 
      - '4040:4040'
    volumes:
      - ./externals/nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - nglog:/var/log/nginx

  postgres:
    image: postgres
    ports: 
      - '5432:5432'
    volumes:
      - pgdb:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: hetu
      POSTGRES_USER: ${HETU_RDS_USERNAME}
      POSTGRES_PASSWORD: ${HETU_RDS_PASSWORD}
    depends_on:
      - elasticsearch

  node:
    build:
      context: .
    depends_on:
      - postgres
    ports:
      - '4000:3000'
    environment:
      HETU_RDS_HOST: postgres
      HETU_RDS_USERNAME: ${HETU_RDS_USERNAME}
      HETU_RDS_PASSWORD: ${HETU_RDS_PASSWORD}

volumes:
  esdata:
  nglog:
  pgdb:
